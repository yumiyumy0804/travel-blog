<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d1a6b"/>
      <stop offset="100%" stop-color="#0d0420"/>
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#fde8d0"/>
      <stop offset="100%" stop-color="#f5cca8"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#0a0604"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1457"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="50%" stop-color="#f0dfa0"/>
      <stop offset="100%" stop-color="#c89030"/>
    </linearGradient>
    <linearGradient id="lip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0607a"/>
      <stop offset="100%" stop-color="#c9507a"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0a0b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0a0b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeshine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4a2a80"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>

  <!-- 背景装飾：星 -->
  <g fill="#d4a843" opacity="0.35" filter="url(#glow)">
    <circle cx="22" cy="30" r="1.2"/>
    <circle cx="170" cy="25" r="0.9"/>
    <circle cx="185" cy="60" r="1.4"/>
    <circle cx="15" cy="80" r="0.8"/>
    <circle cx="178" cy="110" r="1.1"/>
    <circle cx="30" cy="145" r="0.9"/>
  </g>
  <g transform="translate(162,34)" fill="#d4a843" opacity="0.6">
    <path d="M0,-6 L1.2,-1.2 L6,0 L1.2,1.2 L0,6 L-1.2,1.2 L-6,0 L-1.2,-1.2 Z"/>
  </g>
  <g transform="translate(38,158)" fill="#c9507a" opacity="0.5">
    <path d="M0,-4 L0.8,-0.8 L4,0 L0.8,0.8 L0,4 L-0.8,0.8 L-4,0 L-0.8,-0.8 Z"/>
  </g>

  <!-- 胴体・スーツ -->
  <ellipse cx="100" cy="190" rx="62" ry="36" fill="url(#suit)" clip-path="url(#circle)"/>
  <path d="M66 168 L100 155 L134 168 L134 200 L66 200 Z" fill="#1a0a2e" clip-path="url(#circle)"/>
  <path d="M93 155 L100 172 L107 155 Q100 162 93 155Z" fill="#f0eaf8" opacity="0.9"/>
  <path d="M66 168 L93 155 L86 175 Q76 180 66 172Z" fill="#2d1457" clip-path="url(#circle)"/>
  <path d="M134 168 L107 155 L114 175 Q124 180 134 172Z" fill="#2d1457" clip-path="url(#circle)"/>
  <g transform="translate(100,162)" fill="url(#gold)" filter="url(#glow)">
    <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z"/>
  </g>

  <!-- 髪（後ろ・サイド） -->
  <path d="M44 108 Q30 135 36 170" stroke="#0a0604" stroke-width="22" fill="none" stroke-linecap="round" clip-path="url(#circle)" opacity="0.95"/>
  <path d="M156 108 Q170 135 164 170" stroke="#0a0604" stroke-width="22" fill="none" stroke-linecap="round" clip-path="url(#circle)" opacity="0.95"/>
  <ellipse cx="100" cy="85" rx="58" ry="56" fill="url(#hair)"/>

  <!-- 顔（肌） -->
  <path d="M64 90 Q62 70 75 58 Q100 44 125 58 Q138 70 136 90 Q136 118 124 130 Q112 140 100 142 Q88 140 76 130 Q64 118 64 90 Z" fill="url(#skin)"/>

  <!-- 前髪 -->
  <path d="M44 82 Q46 52 100 44 Q154 52 156 82 Q148 68 128 64 Q114 60 100 60 Q86 60 72 64 Q52 68 44 82 Z" fill="url(#hair)"/>
  <path d="M44 82 Q50 66 64 68 Q58 74 56 82Z" fill="#0a0604"/>
  <path d="M64 68 Q75 60 88 62" stroke="#1a0e04" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M56 78 Q65 70 80 68" stroke="#1a0e04" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- 眉毛 -->
  <path d="M73 82 Q82 77 92 79" stroke="#2a1208" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M108 79 Q118 77 127 82" stroke="#2a1208" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 左目 -->
  <ellipse cx="83" cy="96" rx="11" ry="9" fill="#1a0a04" opacity="0.15"/>
  <ellipse cx="83" cy="95" rx="10" ry="8.5" fill="white"/>
  <ellipse cx="83" cy="95" rx="7" ry="7.5" fill="url(#eyeshine)"/>
  <ellipse cx="83" cy="95" rx="4" ry="4.5" fill="#050208"/>
  <ellipse cx="85" cy="92" rx="2.2" ry="1.8" fill="white"/>
  <circle cx="80" cy="97" r="1.1" fill="white" opacity="0.6"/>
  <path d="M73 89 Q75 87 77 88" stroke="#0a0604" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M77 87 Q80 85 83 86" stroke="#0a0604" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M83 86 Q87 85 90 87" stroke="#0a0604" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M90 88 Q92 87 93 89" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M73 93 Q75 89 83 88 Q91 89 93 93" stroke="#1a0a04" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- 右目 -->
  <ellipse cx="117" cy="96" rx="11" ry="9" fill="#1a0a04" opacity="0.15"/>
  <ellipse cx="117" cy="95" rx="10" ry="8.5" fill="white"/>
  <ellipse cx="117" cy="95" rx="7" ry="7.5" fill="url(#eyeshine)"/>
  <ellipse cx="117" cy="95" rx="4" ry="4.5" fill="#050208"/>
  <ellipse cx="119" cy="92" rx="2.2" ry="1.8" fill="white"/>
  <circle cx="114" cy="97" r="1.1" fill="white" opacity="0.6"/>
  <path d="M107 89 Q109 87 111 88" stroke="#0a0604" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M111 87 Q114 85 117 86" stroke="#0a0604" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M117 86 Q121 85 124 87" stroke="#0a0604" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M124 88 Q126 87 127 89" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M107 93 Q109 89 117 88 Q125 89 127 93" stroke="#1a0a04" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- 鼻 -->
  <path d="M97 108 Q100 113 103 108" stroke="#d4a070" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="96.5" cy="110" rx="1.6" ry="1.2" fill="#c8906a" opacity="0.4"/>
  <ellipse cx="103.5" cy="110" rx="1.6" ry="1.2" fill="#c8906a" opacity="0.4"/>

  <!-- くちびる -->
  <path d="M85 120 Q91 117 100 118 Q109 117 115 120 Q109 123 100 122 Q91 123 85 120Z" fill="url(#lip)"/>
  <path d="M85 120 Q88 126 100 128 Q112 126 115 120 Q109 123 100 122 Q91 123 85 120Z" fill="#d8607a"/>
  <path d="M84 120 Q83 122 85 124" stroke="#c9507a" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M116 120 Q117 122 115 124" stroke="#c9507a" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M92 121 Q100 120 108 121" stroke="#f0a0b8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- ほほ（チーク） -->
  <ellipse cx="70" cy="108" rx="12" ry="8" fill="url(#blush)"/>
  <ellipse cx="130" cy="108" rx="12" ry="8" fill="url(#blush)"/>

  <!-- 耳 -->
  <ellipse cx="63" cy="110" rx="4" ry="5" fill="#f5cca8"/>
  <ellipse cx="137" cy="110" rx="4" ry="5" fill="#f5cca8"/>

  <!-- ゴールドフープイヤリング -->
  <circle cx="59" cy="116" r="7" fill="none" stroke="url(#gold)" stroke-width="2.8" filter="url(#glow)"/>
  <circle cx="59" cy="116" r="7" fill="none" stroke="#f0dfa0" stroke-width="0.8" opacity="0.6"/>
  <circle cx="141" cy="116" r="7" fill="none" stroke="url(#gold)" stroke-width="2.8" filter="url(#glow)"/>
  <circle cx="141" cy="116" r="7" fill="none" stroke="#f0dfa0" stroke-width="0.8" opacity="0.6"/>

  <!-- 外枠ゴールドリング -->
  <circle cx="100" cy="100" r="97.5" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.45"/>
  <circle cx="100" cy="100" r="99" fill="none" stroke="#d4a843" stroke-width="0.5" opacity="0.2"/>
</svg>
